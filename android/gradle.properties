org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# Flutter temporary AGP 9 compatibility (keep until Flutter supports builtInKotlin=true;
# tracked: flutter/flutter#187712). With builtInKotlin=false, app must apply kotlin-android
# and use android.kotlinOptions (not the built-in kotlin { compilerOptions } DSL).
# Do not remove this opt-out until Flutter documents AGP 9 built-in Kotlin support.
android.builtInKotlin=false
android.newDsl=false
